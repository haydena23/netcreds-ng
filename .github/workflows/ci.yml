name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src tests tools
      - name: Type check
        run: python -m mypy
      - name: Tests
        run: python -m pytest -q
      - name: Example plugin
        run: |
          python -m pip install ./examples/netcreds-ng-example-plugin
          python -m pytest -q examples/netcreds-ng-example-plugin/tests
          netcreds-ng --list-plugins
